name: guettgui_mobile
description: Guett Gui - Application de gestion d'elevage avicole
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.3
  path: ^1.9.0

  # Network
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3
  socket_io_client: ^2.0.3+1

  # Charts
  fl_chart: ^0.68.0

  # PDF & Export
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^9.0.0

  # Notifications
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.1.2

  # Media
  image_picker: ^1.1.1
  flutter_image_compress: ^2.2.0
  cached_network_image: ^3.3.1

  # Storage
  flutter_secure_storage: ^9.2.2

  # UI
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
